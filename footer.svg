<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Mohamed Elnady — Ship Fast. Feel Native. Scale Clean.">
  <defs>
    <clipPath id="footer-card-clip-dark">
      <rect x="8" y="8" width="1184" height="124" rx="18" />
    </clipPath>

    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="55%" stop-color="#0B1324" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="footer-stroke-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#24344D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="footer-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0" />
      <stop offset="20%" stop-color="#61DAFB" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#0A66C2" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="footer-capsule-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="footer-capsule-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0B111E" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="footer-text-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#61DAFB" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <radialGradient id="footer-spotlight" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#0A66C2" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <pattern id="footer-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#61DAFB" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="40" cy="0" r="0.9" fill="#61DAFB" fill-opacity="0.2" />
    </pattern>

    <filter id="footer-glow-fx" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes capsuleFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes auraBreath {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 10px rgba(97, 218, 251, 0.25)); }
        50% { opacity: 1; filter: drop-shadow(0 0 18px rgba(97, 218, 251, 0.55)); }
      }
      @keyframes starBlink {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.3); }
      }
      @keyframes eqBar {
        0%, 100% { transform: scaleY(0.42); }
        50% { transform: scaleY(1); }
      }

      .capsule-float { animation: capsuleFloat 4.2s ease-in-out infinite; }
      .capsule-aura { animation: auraBreath 3.8s ease-in-out infinite; }
      .f-star { transform-box: fill-box; transform-origin: center; }
      .f-star-1 { animation: starBlink 3s ease-in-out infinite; }
      .f-star-2 { animation: starBlink 4.2s ease-in-out 1.3s infinite; }
      .eq-1 { transform-box: fill-box; transform-origin: center; animation: eqBar 1.8s ease-in-out infinite; }
      .eq-2 { transform-box: fill-box; transform-origin: center; animation: eqBar 1.4s ease-in-out 0.4s infinite; }
      .eq-3 { transform-box: fill-box; transform-origin: center; animation: eqBar 2.1s ease-in-out 0.8s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .capsule-float, .capsule-aura, .f-star, .eq-1, .eq-2, .eq-3 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#footer-card-clip-dark)">
    <rect x="8" y="8" width="1184" height="124" fill="url(#footer-bg)" />
    <rect x="8" y="8" width="1184" height="124" fill="url(#footer-spotlight)" />
    <rect x="8" y="8" width="1184" height="124" fill="url(#footer-grid)" opacity="0.85" />
  </g>

  <rect x="8.75" y="8.75" width="1182.5" height="122.5" rx="18" fill="none" stroke="url(#footer-stroke-dark)" stroke-width="1.4" />

  <!-- Horizon Scanner Line -->
  <line x1="110" y1="22" x2="1090" y2="22" stroke="url(#footer-laser)" stroke-width="1.6" filter="url(#footer-glow-fx)" opacity="0.85" />
  <circle cx="600" cy="22" r="3" fill="#FFFFFF" filter="url(#footer-glow-fx)">
    <animate attributeName="cx" values="220;980;220" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Ambient Stars -->
  <g fill="#61DAFB">
    <circle class="f-star f-star-1" cx="165" cy="48" r="1.5" />
    <circle class="f-star f-star-2" cx="225" cy="96" r="1.3" fill="#38BDF8" />
    <circle class="f-star f-star-1" cx="975" cy="46" r="1.5" />
    <circle class="f-star f-star-2" cx="1035" cy="94" r="1.6" fill="#FFFFFF" />
  </g>

  <!-- Symmetric HUD Brackets -->
  <g opacity="0.65" stroke="url(#footer-capsule-stroke)" stroke-width="1.3" fill="none">
    <path d="M 326 47 L 292 47 L 276 68 L 292 89 L 326 89" />
    <path d="M 874 47 L 908 47 L 924 68 L 908 89 L 874 89" />
  </g>

  <!-- Equalizer Bars -->
  <g fill="#61DAFB" opacity="0.82">
    <rect class="eq-1" x="302" y="58" width="3" height="20" rx="1.5" />
    <rect class="eq-2" x="309" y="58" width="3" height="20" rx="1.5" fill="#38BDF8" />
    <rect class="eq-3" x="316" y="58" width="3" height="20" rx="1.5" />

    <rect class="eq-3" x="881" y="58" width="3" height="20" rx="1.5" />
    <rect class="eq-2" x="888" y="58" width="3" height="20" rx="1.5" fill="#38BDF8" />
    <rect class="eq-1" x="895" y="58" width="3" height="20" rx="1.5" />
  </g>

  <!-- Centered Motto Capsule with Vector Bolts -->
  <g transform="translate(600, 68)">
    <g class="capsule-float">
      <rect class="capsule-aura" x="-244" y="-22" width="488" height="44" rx="22" fill="url(#footer-capsule-bg)" stroke="url(#footer-capsule-stroke)" stroke-width="1.5" />
      <path d="M -212 -7.5 L -218.5 1 H -213.5 L -215 7.5 L -208 -0.5 H -213 L -212 -7.5 Z" fill="#61DAFB" />
      <text x="0" y="5" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="url(#footer-text-chrome)" letter-spacing="2.4" text-anchor="middle">
        SHIP FAST <tspan fill="#61DAFB">·</tspan> FEEL NATIVE <tspan fill="#61DAFB">·</tspan> SCALE CLEAN
      </text>
      <path d="M 213 -7.5 L 206.5 1 H 211.5 L 210 7.5 L 217 -0.5 H 212 L 213 -7.5 Z" fill="#61DAFB" />
    </g>
  </g>

  <!-- Bottom Signature Tagline -->
  <text x="600" y="114" font-family="'SF Mono', 'Fira Code', -apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.5" text-anchor="middle">
    ARCHITECTING PRODUCTION MOBILE ECOSYSTEMS <tspan fill="#61DAFB">•</tspan> E-COMMERCE <tspan fill="#61DAFB">•</tspan> PROPTECH <tspan fill="#61DAFB">•</tspan> ON-DEMAND
  </text>
</svg>
