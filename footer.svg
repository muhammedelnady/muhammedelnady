<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="100%" role="img" aria-label="Mohamed Elnady — Ship Fast. Feel Native. Scale Clean.">
  <defs>
    <!-- Seamless Vertical Alpha Mask -->
    <linearGradient id="footer-fade-mask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <mask id="footer-seamless-mask">
      <rect width="1200" height="150" fill="url(#footer-fade-mask)" />
    </mask>

    <!-- Deep Cyber Background -->
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Horizon Laser Line -->
    <linearGradient id="footer-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0" />
      <stop offset="20%" stop-color="#61DAFB" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="80%" stop-color="#0A66C2" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0" />
    </linearGradient>

    <!-- Glassmorphic Capsule Gradients -->
    <linearGradient id="footer-capsule-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="footer-capsule-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="footer-text-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#61DAFB" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <radialGradient id="footer-spotlight" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0A66C2" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="footer-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#61DAFB" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="40" cy="0" r="1" fill="#61DAFB" fill-opacity="0.22" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="footer-glow-fx" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes capsuleFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes auraBreath {
        0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 12px rgba(97, 218, 251, 0.35)); }
        50% { opacity: 1; filter: drop-shadow(0 0 22px rgba(97, 218, 251, 0.75)); }
      }
      @keyframes starBlink {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.95; transform: scale(1.35); }
      }
      @keyframes eqBar {
        0%, 100% { transform: scaleY(0.4); }
        50% { transform: scaleY(1); }
      }

      .capsule-float { animation: capsuleFloat 4.2s ease-in-out infinite; }
      .capsule-aura { animation: auraBreath 3.8s ease-in-out infinite; }
      .f-star { transform-box: fill-box; transform-origin: center; }
      .f-star-1 { animation: starBlink 3s ease-in-out infinite; }
      .f-star-2 { animation: starBlink 4.2s ease-in-out 1.3s infinite; }
      .eq-1 { transform-box: fill-box; transform-origin: center; animation: eqBar 1.8s ease-in-out infinite; }
      .eq-2 { transform-box: fill-box; transform-origin: center; animation: eqBar 1.4s ease-in-out 0.4s infinite; }
      .eq-3 { transform-box: fill-box; transform-origin: center; animation: eqBar 2.1s ease-in-out 0.8s infinite; }
    </style>
  </defs>

  <!-- 1. SEAMLESS BACKGROUND & PERSPECTIVE GRID -->
  <g mask="url(#footer-seamless-mask)">
    <rect width="1200" height="150" fill="url(#footer-bg)" />
    <rect width="1200" height="150" fill="url(#footer-spotlight)" />
    <rect width="1200" height="150" fill="url(#footer-grid)" opacity="0.8" />
  </g>

  <!-- 2. ANIMATED LASER SCANNER HORIZON -->
  <line x1="80" y1="16" x2="1120" y2="16" stroke="url(#footer-laser)" stroke-width="2" filter="url(#footer-glow-fx)" />
  <!-- Scanning Photon Node -->
  <circle cx="600" cy="16" r="3.5" fill="#FFFFFF" filter="url(#footer-glow-fx)">
    <animate attributeName="cx" values="220;980;220" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- 3. AMBIENT TWINKLING STARS -->
  <g fill="#61DAFB">
    <circle class="f-star f-star-1" cx="180" cy="48" r="1.6" />
    <circle class="f-star f-star-2" cx="310" cy="102" r="1.3" fill="#38BDF8" />
    <circle class="f-star f-star-1" cx="890" cy="42" r="1.5" />
    <circle class="f-star f-star-2" cx="1020" cy="96" r="1.7" fill="#FFFFFF" />
    <circle class="f-star f-star-1" cx="110" cy="88" r="1.2" fill="#FFFFFF" />
    <circle class="f-star f-star-2" cx="1090" cy="54" r="1.4" />
  </g>

  <!-- 4. SYMMETRIC CYBER HUD BRACKETS & LIVE TELEMETRY BARS -->
  <g opacity="0.65" stroke="url(#footer-capsule-stroke)" stroke-width="1.4" fill="none">
    <!-- Left HUD Bracket -->
    <path d="M 315 50 L 280 50 L 264 72 L 280 94 L 315 94" />
    <!-- Right HUD Bracket -->
    <path d="M 885 50 L 920 50 L 936 72 L 920 94 L 885 94" />
  </g>

  <!-- Left & Right Equalizer Telemetry Bars -->
  <g fill="#61DAFB" opacity="0.8">
    <rect class="eq-1" x="292" y="62" width="3" height="20" rx="1.5" />
    <rect class="eq-2" x="299" y="62" width="3" height="20" rx="1.5" fill="#38BDF8" />
    <rect class="eq-3" x="306" y="62" width="3" height="20" rx="1.5" />

    <rect class="eq-3" x="891" y="62" width="3" height="20" rx="1.5" />
    <rect class="eq-2" x="898" y="62" width="3" height="20" rx="1.5" fill="#38BDF8" />
    <rect class="eq-1" x="905" y="62" width="3" height="20" rx="1.5" />
  </g>

  <!-- 5. CENTERED REACTOR MOTTO CAPSULE (Outer group locks center coordinates, inner group floats) -->
  <g transform="translate(600, 72)">
    <g class="capsule-float">
      <rect class="capsule-aura" x="-250" y="-24" width="500" height="48" rx="24" fill="url(#footer-capsule-bg)" stroke="url(#footer-capsule-stroke)" stroke-width="1.6" />
      <text x="0" y="5.5" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="url(#footer-text-chrome)" letter-spacing="2.8" text-anchor="middle">
        ⚡ SHIP FAST <tspan fill="#61DAFB">·</tspan> FEEL NATIVE <tspan fill="#61DAFB">·</tspan> SCALE CLEAN ⚡
      </text>
    </g>
  </g>

  <!-- 6. BOTTOM SIGNATURE TAGLINE -->
  <text x="600" y="126" font-family="'SF Mono', 'Fira Code', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.6" text-anchor="middle">
    ARCHITECTING PRODUCTION MOBILE ECOSYSTEMS <tspan fill="#61DAFB">•</tspan> E-COMMERCE <tspan fill="#61DAFB">•</tspan> REAL ESTATE <tspan fill="#61DAFB">•</tspan> ON-DEMAND
  </text>
</svg>
