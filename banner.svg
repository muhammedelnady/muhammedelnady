<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" height="100%" role="img" aria-label="Mohamed Elnady — Senior React Native &amp; Mobile Architect">
  <defs>
    <!-- Seamless Vertical Fade Mask -->
    <linearGradient id="banner-fade-mask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="8%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="72%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="88%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <mask id="hero-seamless-mask">
      <rect width="1200" height="330" fill="url(#banner-fade-mask)" />
    </mask>

    <!-- Ultra-Deep Cyber Canvas -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="35%" stop-color="#0A1124" />
      <stop offset="70%" stop-color="#0D162E" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Aurora Spotlights -->
    <radialGradient id="aurora-cyan" cx="18%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurora-blue" cx="82%" cy="55%" r="52%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurora-core" cx="50%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0A66C2" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Chrome / Liquid Metal Name Gradient -->
    <linearGradient id="chrome-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#F0F9FF" />
      <stop offset="58%" stop-color="#61DAFB" />
      <stop offset="82%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Glassmorphic Card Borders & Fills -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.62" />
    </linearGradient>

    <linearGradient id="laser-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0" />
      <stop offset="20%" stop-color="#61DAFB" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#0A66C2" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0" />
    </linearGradient>

    <!-- Fine Engineering Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#61DAFB" stroke-width="0.6" stroke-opacity="0.08" />
      <circle cx="40" cy="0" r="1" fill="#61DAFB" fill-opacity="0.28" />
      <circle cx="0" cy="40" r="0.8" fill="#38BDF8" fill-opacity="0.18" />
    </pattern>

    <!-- Intense Neon Glow Filter -->
    <filter id="hyper-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- CSS Keyframes -->
    <style>
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(5px); }
      }
      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarPulse {
        0% { r: 4px; opacity: 0.9; }
        100% { r: 14px; opacity: 0; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.18; transform: scale(0.75); }
        50% { opacity: 0.95; transform: scale(1.35); }
      }
      @keyframes barPulse1 {
        0%, 100% { width: 42px; }
        50% { width: 58px; }
      }
      @keyframes barPulse2 {
        0%, 100% { width: 54px; }
        50% { width: 34px; }
      }
      @keyframes barPulse3 {
        0%, 100% { width: 28px; }
        50% { width: 50px; }
      }

      .float-main { animation: floatY 5.5s ease-in-out infinite; }
      .float-alt { animation: floatReverse 4.5s ease-in-out infinite; }
      .orbit-cw { animation: spinCW 24s linear infinite; transform-origin: 145px 155px; }
      .orbit-ccw { animation: spinCCW 19s linear infinite; transform-origin: 145px 155px; }
      .orbit-slow { animation: spinCW 32s linear infinite; transform-origin: 145px 155px; }
      .stream-fast { stroke-dasharray: 90, 310; animation: dataFlow 5.5s linear infinite; }
      .stream-slow { stroke-dasharray: 60, 340; animation: dataFlow 8s linear infinite; }
      .spark { transform-box: fill-box; transform-origin: center; }
      .spark-1 { animation: starTwinkle 3.2s ease-in-out infinite; }
      .spark-2 { animation: starTwinkle 4.5s ease-in-out 1.4s infinite; }
      .spark-3 { animation: starTwinkle 2.8s ease-in-out 0.7s infinite; }
      .code-line-1 { animation: barPulse1 3.2s ease-in-out infinite; }
      .code-line-2 { animation: barPulse2 2.6s ease-in-out infinite; }
      .code-line-3 { animation: barPulse3 3.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- 1. SEAMLESS BACKGROUND & PERSPECTIVE CYBER HORIZON -->
  <g mask="url(#hero-seamless-mask)">
    <rect width="1200" height="330" fill="url(#cyber-bg)" />
    <rect width="1200" height="330" fill="url(#aurora-cyan)" />
    <rect width="1200" height="330" fill="url(#aurora-blue)" />
    <rect width="1200" height="330" fill="url(#aurora-core)" />
    <rect width="1200" height="330" fill="url(#cyber-grid)" />

    <!-- Perspective 3D Horizon Rays at Bottom -->
    <g opacity="0.22" stroke="#38BDF8" stroke-width="0.7">
      <line x1="600" y1="165" x2="100" y2="330" />
      <line x1="600" y1="165" x2="280" y2="330" />
      <line x1="600" y1="165" x2="440" y2="330" />
      <line x1="600" y1="165" x2="600" y2="330" />
      <line x1="600" y1="165" x2="760" y2="330" />
      <line x1="600" y1="165" x2="920" y2="330" />
      <line x1="600" y1="165" x2="1100" y2="330" />
    </g>

    <!-- High-Speed Animated Data Streams -->
    <g fill="none" stroke-linecap="round">
      <path d="M -50 65 Q 260 130 550 75 T 1250 60" stroke="#61DAFB" stroke-width="1" opacity="0.12" />
      <path class="stream-fast" d="M -50 65 Q 260 130 550 75 T 1250 60" stroke="#61DAFB" stroke-width="2" filter="url(#hyper-glow)" opacity="0.75" />

      <path d="M -50 245 Q 340 190 660 235 T 1250 205" stroke="#0A66C2" stroke-width="1" opacity="0.15" />
      <path class="stream-slow" d="M -50 245 Q 340 190 660 235 T 1250 205" stroke="#38BDF8" stroke-width="1.8" filter="url(#hyper-glow)" opacity="0.65" />
    </g>
  </g>

  <!-- 2. AMBIENT QUANTUM PARTICLES -->
  <g fill="#61DAFB">
    <circle class="spark spark-1" cx="290" cy="48" r="1.8" />
    <circle class="spark spark-2" cx="910" cy="42" r="2.0" fill="#FFFFFF" />
    <circle class="spark spark-3" cx="340" cy="185" r="1.4" fill="#38BDF8" />
    <circle class="spark spark-1" cx="860" cy="190" r="1.6" />
    <circle class="spark spark-2" cx="255" cy="260" r="1.5" fill="#FFFFFF" />
    <circle class="spark spark-3" cx="945" cy="265" r="1.8" fill="#38BDF8" />
  </g>

  <!-- 3. LEFT ENGINE: 3D REACT NATIVE QUANTUM CORE & FLOATING BRIDGES -->
  <g class="float-main">
    <!-- Ambient Core Aura -->
    <circle cx="145" cy="155" r="56" fill="#61DAFB" opacity="0.06" filter="url(#hyper-glow)" />

    <!-- Outer Tech Ring -->
    <circle cx="145" cy="155" r="96" fill="none" stroke="#38BDF8" stroke-width="0.7" opacity="0.25" stroke-dasharray="6 8" />

    <!-- Orbit 1 (0 deg) -->
    <g>
      <ellipse class="orbit-cw" cx="145" cy="155" rx="90" ry="34" fill="none" stroke="#61DAFB" stroke-width="1.8" opacity="0.85" stroke-dasharray="130 18 45 14" filter="url(#hyper-glow)" />
    </g>

    <!-- Orbit 2 (60 deg preserved via outer group) -->
    <g transform="rotate(60 145 155)">
      <ellipse class="orbit-ccw" cx="145" cy="155" rx="90" ry="34" fill="none" stroke="#38BDF8" stroke-width="1.6" opacity="0.7" stroke-dasharray="95 22 30 15" />
    </g>

    <!-- Orbit 3 (120 deg preserved via outer group) -->
    <g transform="rotate(120 145 155)">
      <ellipse class="orbit-slow" cx="145" cy="155" rx="90" ry="34" fill="none" stroke="#0A66C2" stroke-width="1.8" opacity="0.8" stroke-dasharray="110 20" />
    </g>

    <!-- Glowing Nucleus -->
    <circle cx="145" cy="155" r="11" fill="#61DAFB" opacity="0.85" filter="url(#hyper-glow)" />
    <circle cx="145" cy="155" r="5" fill="#FFFFFF" />

    <!-- Floating Micro-HUD Pill: JSI / Fabric -->
    <g class="float-alt" filter="url(#soft-shadow)">
      <rect x="42" y="54" width="96" height="24" rx="6" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1" />
      <circle cx="54" cy="66" r="3" fill="#61DAFB" />
      <text x="64" y="70" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="9.5" font-weight="700" fill="#E2E8F0">JSI · FABRIC</text>
    </g>

    <!-- Floating Micro-HUD Pill: Native Modules -->
    <g class="float-alt" filter="url(#soft-shadow)">
      <rect x="152" y="232" width="108" height="24" rx="6" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1" />
      <circle cx="164" cy="244" r="3" fill="#10B981" />
      <text x="174" y="248" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="9.5" font-weight="700" fill="#E2E8F0">NATIVE BRIDGE</text>
    </g>
  </g>

  <!-- 4. RIGHT ENGINE: HOLOGRAPHIC MOBILE DEVICE & LIVE TELEMETRY HUD -->
  <g transform="translate(985, 42)">
    <g class="float-main">
      <!-- Phone Frame with Glassmorphism & Shadow -->
      <rect x="0" y="0" width="112" height="204" rx="20" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.8" filter="url(#soft-shadow)" />
      <rect x="5" y="5" width="102" height="194" rx="16" fill="#060B16" opacity="0.85" />

      <!-- Dynamic Island Notch -->
      <rect x="36" y="11" width="40" height="7" rx="3.5" fill="#000000" stroke="#1E293B" stroke-width="0.8" />
      <circle cx="69" cy="14.5" r="1.8" fill="#10B981" />

      <!-- App Header Telemetry inside Screen -->
      <rect x="14" y="28" width="46" height="5" rx="2.5" fill="#61DAFB" opacity="0.9" />
      <rect x="14" y="37" width="30" height="3.5" rx="1.7" fill="#64748B" />
      <circle cx="90" cy="33" r="6" fill="#0A66C2" opacity="0.4" stroke="#61DAFB" stroke-width="1" />

      <!-- Interactive Live Code / UI Card inside Phone -->
      <rect x="12" y="50" width="88" height="58" rx="9" fill="#0F172A" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.5" />
      <circle cx="22" cy="61" r="2.5" fill="#EF4444" />
      <circle cx="30" cy="61" r="2.5" fill="#F59E0B" />
      <circle cx="38" cy="61" r="2.5" fill="#10B981" />

      <!-- Animated Live Code Lines -->
      <rect class="code-line-1" x="20" y="72" width="42" height="4" rx="2" fill="#61DAFB" opacity="0.9" />
      <rect class="code-line-2" x="20" y="81" width="54" height="4" rx="2" fill="#38BDF8" opacity="0.7" />
      <rect class="code-line-3" x="20" y="90" width="28" height="4" rx="2" fill="#A855F7" opacity="0.85" />

      <!-- Performance Graph Card inside Phone -->
      <rect x="12" y="116" width="88" height="44" rx="9" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <polyline points="18,148 32,138 46,143 62,127 78,132 92,122" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="92" cy="122" r="3" fill="#10B981" filter="url(#hyper-glow)" />

      <!-- Bottom Action Pill & Home Indicator -->
      <rect x="14" y="168" width="84" height="16" rx="6" fill="#0A66C2" fill-opacity="0.45" stroke="#61DAFB" stroke-width="0.8" />
      <rect x="38" y="174.5" width="36" height="3" rx="1.5" fill="#FFFFFF" opacity="0.9" />
      <rect x="36" y="191" width="40" height="3.5" rx="1.7" fill="#64748B" opacity="0.8" />

      <!-- Floating Left Overlay Card: 60 FPS / 120Hz -->
      <g class="float-alt" transform="translate(-52, 34)" filter="url(#soft-shadow)">
        <rect x="0" y="0" width="86" height="28" rx="8" fill="url(#glass-fill)" stroke="#10B981" stroke-width="1.1" />
        <circle cx="14" cy="14" r="3.5" fill="#10B981" />
        <text x="24" y="17.5" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="10" font-weight="700" fill="#ECFDF5">120Hz UI</text>
      </g>

      <!-- Floating Right Overlay Card: 99.9% Crash-Free -->
      <g class="float-alt" transform="translate(56, 132)" filter="url(#soft-shadow)">
        <rect x="0" y="0" width="98" height="28" rx="8" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.1" />
        <text x="49" y="17.5" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="9.5" font-weight="700" fill="#61DAFB" text-anchor="middle">⚡ 15+ APPS LIVE</text>
      </g>
    </g>
  </g>

  <!-- 5. CENTERPIECE HERO TYPOGRAPHY & COMMAND HUD -->
  <g text-anchor="middle" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- Top Laser Accent Bar -->
    <line x1="380" y1="22" x2="820" y2="22" stroke="url(#laser-line)" stroke-width="1.5" opacity="0.8" />

    <!-- Status Capsule with Radar Pulse -->
    <g transform="translate(600, 50)" filter="url(#soft-shadow)">
      <rect x="-215" y="-15" width="430" height="30" rx="15" fill="#0B132B" fill-opacity="0.9" stroke="url(#glass-border)" stroke-width="1.3" />
      <!-- Radar Pulse Dot -->
      <circle cx="-190" cy="0" r="4" fill="#10B981">
        <animate attributeName="r" values="4;13" dur="2.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="-190" cy="0" r="4.5" fill="#10B981" />
      <text x="10" y="4" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="2">
        SENIOR MOBILE ARCHITECT <tspan fill="#61DAFB">·</tspan> 8+ YEARS EXP
      </text>
    </g>

    <!-- Main Hero Name with Liquid Chrome & Hyper Glow -->
    <text x="600" y="128" font-size="58" font-weight="900" fill="url(#chrome-title)" letter-spacing="-0.8" filter="drop-shadow(0 4px 20px rgba(97,218,251,0.32))">
      Mohamed Elnady
    </text>

    <!-- High-Impact Subtitle -->
    <text x="600" y="168" font-size="17" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
      Engineering High-Scale Mobile Ecosystems <tspan fill="#61DAFB" font-weight="700">·</tspan>
      <tspan fill="#E2E8F0">React Native</tspan>
      <tspan fill="#61DAFB" font-weight="700">·</tspan>
      <tspan fill="#E2E8F0">Swift &amp; Kotlin</tspan>
    </text>

    <!-- Subtle Divider Accent -->
    <line x1="450" y1="190" x2="750" y2="190" stroke="url(#laser-line)" stroke-width="1" opacity="0.55" />
    <circle cx="600" cy="190" r="2.5" fill="#61DAFB" filter="url(#hyper-glow)" />

    <!-- 6. SYMMETRIC GLASSMORPHIC TECH PILLS -->
    <g transform="translate(600, 214)" filter="url(#soft-shadow)">

      <!-- Pill 1: React Native -->
      <g transform="translate(-382, 0)">
        <rect x="0" y="0" width="138" height="36" rx="10" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.3" />
        <circle cx="16" cy="18" r="3.5" fill="#61DAFB" />
        <text x="75" y="22.5" font-size="12.5" font-weight="700" fill="#F8FAFC">React Native</text>
      </g>

      <!-- Pill 2: iOS (Swift) -->
      <g transform="translate(-232, 0)">
        <rect x="0" y="0" width="132" height="36" rx="10" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.3" />
        <circle cx="16" cy="18" r="3.5" fill="#38BDF8" />
        <text x="72" y="22.5" font-size="12.5" font-weight="700" fill="#F8FAFC">iOS · Swift</text>
      </g>

      <!-- Pill 3: Android (Kotlin) -->
      <g transform="translate(-88, 0)">
        <rect x="0" y="0" width="156" height="36" rx="10" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.3" />
        <circle cx="16" cy="18" r="3.5" fill="#10B981" />
        <text x="84" y="22.5" font-size="12.5" font-weight="700" fill="#F8FAFC">Android · Kotlin</text>
      </g>

      <!-- Pill 4: Expo & CI/CD -->
      <g transform="translate(80, 0)">
        <rect x="0" y="0" width="118" height="36" rx="10" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.3" />
        <circle cx="16" cy="18" r="3.5" fill="#F59E0B" />
        <text x="65" y="22.5" font-size="12.5" font-weight="700" fill="#F8FAFC">Expo SDK</text>
      </g>

      <!-- Pill 5: Clean Architecture -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="172" height="36" rx="10" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.3" />
        <circle cx="16" cy="18" r="3.5" fill="#A855F7" />
        <text x="92" y="22.5" font-size="12.5" font-weight="700" fill="#F8FAFC">Clean Architecture</text>
      </g>

    </g>
  </g>
</svg>
