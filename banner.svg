    <rect x="1" y="1" width="894" height="314" fill="url(#hero-glow-a-dark)" />
    <rect x="1" y="1" width="894" height="314" fill="url(#hero-glow-b-dark)" />
    <rect x="1" y="1" width="894" height="314" fill="url(#hero-grid-dark)" />
