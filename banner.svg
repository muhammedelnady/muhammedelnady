<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mohamed Elnady — Senior React Native &amp; Mobile Architect">
  <defs>
    <clipPath id="banner-card-clip-dark">
      <rect x="8" y="8" width="1184" height="304" rx="18" />
    </clipPath>

    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="45%" stop-color="#0B1324" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <radialGradient id="aurora-cyan" cx="16%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070B16" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurora-blue" cx="84%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurora-core" cx="50%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="card-stroke-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#24344D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="chrome-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E0F2FE" />
      <stop offset="62%" stop-color="#61DAFB" />
      <stop offset="85%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.72" />
    </linearGradient>

    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.78" />
    </linearGradient>

    <linearGradient id="laser-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0" />
      <stop offset="22%" stop-color="#61DAFB" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="78%" stop-color="#0A66C2" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0" />
    </linearGradient>

    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#61DAFB" stroke-width="0.6" stroke-opacity="0.07" />
      <circle cx="40" cy="0" r="0.9" fill="#61DAFB" fill-opacity="0.24" />
    </pattern>

    <filter id="hyper-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(4px); }
      }
      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.3); }
      }
      @keyframes barScale1 {
        0%, 100% { transform: scaleX(0.74); }
        50% { transform: scaleX(1.0); }
      }
      @keyframes barScale2 {
        0%, 100% { transform: scaleX(1.0); }
        50% { transform: scaleX(0.62); }
      }
      @keyframes barScale3 {
        0%, 100% { transform: scaleX(0.54); }
        50% { transform: scaleX(0.92); }
      }

      .float-main { animation: floatY 5.5s ease-in-out infinite; }
      .float-alt { animation: floatReverse 4.5s ease-in-out infinite; }
      .orbit-cw { animation: spinCW 24s linear infinite; transform-origin: 126px 158px; }
      .orbit-ccw { animation: spinCCW 19s linear infinite; transform-origin: 126px 158px; }
      .orbit-slow { animation: spinCW 32s linear infinite; transform-origin: 126px 158px; }
      .stream-fast { stroke-dasharray: 90, 310; animation: dataFlow 5.5s linear infinite; }
      .stream-slow { stroke-dasharray: 60, 340; animation: dataFlow 8s linear infinite; }
      .spark { transform-box: fill-box; transform-origin: center; }
      .spark-1 { animation: starTwinkle 3.2s ease-in-out infinite; }
      .spark-2 { animation: starTwinkle 4.4s ease-in-out 1.4s infinite; }
      .spark-3 { animation: starTwinkle 2.8s ease-in-out 0.7s infinite; }
      .code-bar { transform-box: fill-box; transform-origin: left center; }
      .code-line-1 { animation: barScale1 3.2s ease-in-out infinite; }
      .code-line-2 { animation: barScale2 2.6s ease-in-out infinite; }
      .code-line-3 { animation: barScale3 3.8s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .float-main, .float-alt, .orbit-cw, .orbit-ccw, .orbit-slow,
        .stream-fast, .stream-slow, .spark, .code-line-1, .code-line-2, .code-line-3 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- 1. CLIPPED CARD CANVAS -->
  <g clip-path="url(#banner-card-clip-dark)">
    <rect x="8" y="8" width="1184" height="304" fill="url(#cyber-bg)" />
    <rect x="8" y="8" width="1184" height="304" fill="url(#aurora-cyan)" />
    <rect x="8" y="8" width="1184" height="304" fill="url(#aurora-blue)" />
    <rect x="8" y="8" width="1184" height="304" fill="url(#aurora-core)" />
    <rect x="8" y="8" width="1184" height="304" fill="url(#cyber-grid)" />

    <!-- Perspective Horizon Rays -->
    <g opacity="0.16" stroke="#38BDF8" stroke-width="0.7">
      <line x1="600" y1="168" x2="120" y2="312" />
      <line x1="600" y1="168" x2="290" y2="312" />
      <line x1="600" y1="168" x2="445" y2="312" />
      <line x1="600" y1="168" x2="600" y2="312" />
      <line x1="600" y1="168" x2="755" y2="312" />
      <line x1="600" y1="168" x2="910" y2="312" />
      <line x1="600" y1="168" x2="1080" y2="312" />
    </g>

    <!-- Animated Data Streams -->
    <g fill="none" stroke-linecap="round">
      <path d="M 0 64 Q 280 120 560 72 T 1200 58" stroke="#61DAFB" stroke-width="1" opacity="0.10" />
      <path class="stream-fast" d="M 0 64 Q 280 120 560 72 T 1200 58" stroke="#61DAFB" stroke-width="1.8" filter="url(#hyper-glow)" opacity="0.65" />

      <path d="M 0 250 Q 340 198 660 238 T 1200 212" stroke="#0A66C2" stroke-width="1" opacity="0.12" />
      <path class="stream-slow" d="M 0 250 Q 340 198 660 238 T 1200 212" stroke="#38BDF8" stroke-width="1.6" filter="url(#hyper-glow)" opacity="0.55" />
    </g>
  </g>

  <!-- Card Border & Top Specular Hairline -->
  <rect x="8.75" y="8.75" width="1182.5" height="302.5" rx="18" fill="none" stroke="url(#card-stroke-dark)" stroke-width="1.4" />
  <line x1="280" y1="9.2" x2="920" y2="9.2" stroke="url(#laser-line)" stroke-width="1.5" opacity="0.85" />

  <!-- 2. AMBIENT QUANTUM PARTICLES -->
  <g fill="#61DAFB">
    <circle class="spark spark-1" cx="272" cy="48" r="1.7" />
    <circle class="spark spark-2" cx="928" cy="44" r="1.8" fill="#FFFFFF" />
    <circle class="spark spark-3" cx="310" cy="176" r="1.4" fill="#38BDF8" />
    <circle class="spark spark-1" cx="890" cy="180" r="1.5" />
    <circle class="spark spark-2" cx="255" cy="274" r="1.5" fill="#FFFFFF" />
    <circle class="spark spark-3" cx="945" cy="274" r="1.6" fill="#38BDF8" />
  </g>

  <!-- 3. LEFT ENGINE (x: 44..196): REACT NATIVE QUANTUM CORE -->
  <g class="float-main">
    <circle cx="126" cy="158" r="46" fill="#61DAFB" opacity="0.06" filter="url(#hyper-glow)" />
    <circle cx="126" cy="158" r="70" fill="none" stroke="#38BDF8" stroke-width="0.7" opacity="0.25" stroke-dasharray="5 7" />

    <g>
      <ellipse class="orbit-cw" cx="126" cy="158" rx="66" ry="25" fill="none" stroke="#61DAFB" stroke-width="1.7" opacity="0.85" stroke-dasharray="96 14 34 12" filter="url(#hyper-glow)" />
    </g>
    <g transform="rotate(60 126 158)">
      <ellipse class="orbit-ccw" cx="126" cy="158" rx="66" ry="25" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.72" stroke-dasharray="72 16 24 12" />
    </g>
    <g transform="rotate(120 126 158)">
      <ellipse class="orbit-slow" cx="126" cy="158" rx="66" ry="25" fill="none" stroke="#0A66C2" stroke-width="1.7" opacity="0.8" stroke-dasharray="84 16" />
    </g>

    <circle cx="126" cy="158" r="9.5" fill="#61DAFB" opacity="0.85" filter="url(#hyper-glow)" />
    <circle cx="126" cy="158" r="4.2" fill="#FFFFFF" />

    <!-- Pill: JSI · FABRIC (x: 44..152) -->
    <g class="float-alt" filter="url(#soft-shadow)">
      <rect x="44" y="34" width="108" height="24" rx="7" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1" />
      <circle cx="57" cy="46" r="3" fill="#61DAFB" />
      <text x="67" y="49.5" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="9.5" font-weight="700" fill="#E2E8F0">JSI · FABRIC</text>
    </g>

    <!-- Pill: NATIVE BRIDGE (x: 44..168 — strictly < 248 center safe zone) -->
    <g class="float-alt" filter="url(#soft-shadow)">
      <rect x="44" y="258" width="124" height="24" rx="7" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1" />
      <circle cx="57" cy="270" r="3" fill="#10B981" />
      <text x="67" y="273.5" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="9.5" font-weight="700" fill="#E2E8F0">NATIVE BRIDGE</text>
    </g>
  </g>

  <!-- 4. RIGHT ENGINE (x: 978..1164): MOBILE TELEMETRY HUD -->
  <g class="float-main">
    <!-- Phone Frame (1020..1124, y: 48..244) -->
    <rect x="1020" y="48" width="104" height="196" rx="18" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.6" filter="url(#soft-shadow)" />
    <rect x="1025" y="53" width="94" height="186" rx="14" fill="#060B16" opacity="0.88" />

    <!-- Dynamic Island -->
    <rect x="1054" y="59" width="36" height="6.5" rx="3.2" fill="#000000" stroke="#1E293B" stroke-width="0.8" />
    <circle cx="1084" cy="62.2" r="1.6" fill="#10B981" />

    <!-- App Header inside Screen -->
    <rect x="1034" y="75" width="42" height="4.5" rx="2.2" fill="#61DAFB" opacity="0.9" />
    <rect x="1034" y="83" width="28" height="3" rx="1.5" fill="#64748B" />
    <circle cx="1104" cy="79" r="5.5" fill="#0A66C2" opacity="0.4" stroke="#61DAFB" stroke-width="1" />

    <!-- Code Card inside Screen -->
    <rect x="1032" y="96" width="80" height="54" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="0.85" stroke-opacity="0.5" />
    <circle cx="1041" cy="106" r="2.2" fill="#EF4444" />
    <circle cx="1048" cy="106" r="2.2" fill="#F59E0B" />
    <circle cx="1055" cy="106" r="2.2" fill="#10B981" />

    <rect class="code-bar code-line-1" x="1040" y="117" width="54" height="3.8" rx="1.9" fill="#61DAFB" opacity="0.9" />
    <rect class="code-bar code-line-2" x="1040" y="126" width="54" height="3.8" rx="1.9" fill="#38BDF8" opacity="0.72" />
    <rect class="code-bar code-line-3" x="1040" y="135" width="46" height="3.8" rx="1.9" fill="#A855F7" opacity="0.85" />

    <!-- Performance Sparkline Card -->
    <rect x="1032" y="157" width="80" height="40" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <polyline points="1038,187 1051,178 1063,182 1077,168 1091,172 1104,163" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="1104" cy="163" r="2.8" fill="#10B981" filter="url(#hyper-glow)" />

    <!-- Action Bar & Home Indicator -->
    <rect x="1034" y="205" width="76" height="15" rx="5.5" fill="#0A66C2" fill-opacity="0.45" stroke="#61DAFB" stroke-width="0.8" />
    <rect x="1056" y="211" width="32" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.9" />
    <rect x="1054" y="229" width="36" height="3" rx="1.5" fill="#64748B" opacity="0.8" />

    <!-- Floating Pill: 120Hz UI (x: 978..1056 — clear of center pills ending at 944) -->
    <g class="float-alt" filter="url(#soft-shadow)">
      <rect x="978" y="76" width="78" height="24" rx="7" fill="url(#glass-fill)" stroke="#10B981" stroke-width="1.1" />
      <circle cx="990" cy="88" r="3" fill="#10B981" />
      <text x="999" y="91.5" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="9.5" font-weight="700" fill="#ECFDF5">120Hz UI</text>
    </g>

    <!-- Floating Pill: 15+ LIVE with Vector Lightning Icon (x: 1068..1164) -->
    <g class="float-alt" filter="url(#soft-shadow)">
      <rect x="1068" y="218" width="96" height="24" rx="7" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.1" />
      <path d="M 1082.5 223.5 L 1077.5 230.5 H 1081.5 L 1080.5 236.5 L 1086 229.2 H 1082 L 1082.5 223.5 Z" fill="#61DAFB" />
      <text x="1091" y="233.5" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="9.5" font-weight="700" fill="#61DAFB">15+ LIVE</text>
    </g>
  </g>

  <!-- 5. CENTERPIECE HERO TYPOGRAPHY (Safe Zone x: 248..952) -->
  <g text-anchor="middle" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Status Capsule -->
    <g transform="translate(600, 48)" filter="url(#soft-shadow)">
      <rect x="-195" y="-15" width="390" height="30" rx="15" fill="#0B132B" fill-opacity="0.92" stroke="url(#glass-border)" stroke-width="1.2" />
      <circle cx="-171" cy="0" r="4" fill="#10B981">
        <animate attributeName="r" values="4;12" dur="2.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="-171" cy="0" r="4.2" fill="#10B981" />
      <text x="10" y="3.8" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.8">
        SENIOR MOBILE ARCHITECT <tspan fill="#61DAFB">·</tspan> 8+ YEARS EXP
      </text>
    </g>

    <!-- Display Name -->
    <text x="600" y="126" font-size="54" font-weight="800" fill="url(#chrome-title)" letter-spacing="-0.8" filter="drop-shadow(0 4px 18px rgba(97,218,251,0.28))">
      Mohamed Elnady
    </text>

    <!-- Subtitle -->
    <text x="600" y="162" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.4">
      Engineering High-Scale Mobile Ecosystems <tspan fill="#61DAFB" font-weight="700">·</tspan>
      <tspan fill="#E2E8F0">React Native</tspan>
      <tspan fill="#61DAFB" font-weight="700">·</tspan>
      <tspan fill="#E2E8F0">Swift &amp; Kotlin</tspan>
    </text>

    <!-- Hairline Divider -->
    <line x1="430" y1="186" x2="770" y2="186" stroke="url(#laser-line)" stroke-width="1" opacity="0.55" />
    <circle cx="600" cy="186" r="2.4" fill="#61DAFB" filter="url(#hyper-glow)" />

    <!-- 6. SYMMETRIC GLASSMORPHIC TECH PILLS (x: 256..944) -->
    <g transform="translate(600, 210)" filter="url(#soft-shadow)">
      <!-- Pill 1: React Native (w=124) -->
      <g transform="translate(-344, 0)">
        <rect x="0" y="0" width="124" height="34" rx="9" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.2" />
        <circle cx="15" cy="17" r="3.4" fill="#61DAFB" />
        <text x="70" y="21.2" font-size="12" font-weight="700" fill="#F8FAFC">React Native</text>
      </g>

      <!-- Pill 2: iOS · Swift (w=110) -->
      <g transform="translate(-208, 0)">
        <rect x="0" y="0" width="110" height="34" rx="9" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.2" />
        <circle cx="15" cy="17" r="3.4" fill="#38BDF8" />
        <text x="63" y="21.2" font-size="12" font-weight="700" fill="#F8FAFC">iOS · Swift</text>
      </g>

      <!-- Pill 3: Android · Kotlin (w=138) -->
      <g transform="translate(-86, 0)">
        <rect x="0" y="0" width="138" height="34" rx="9" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.2" />
        <circle cx="15" cy="17" r="3.4" fill="#10B981" />
        <text x="77" y="21.2" font-size="12" font-weight="700" fill="#F8FAFC">Android · Kotlin</text>
      </g>

      <!-- Pill 4: Expo SDK (w=106) -->
      <g transform="translate(64, 0)">
        <rect x="0" y="0" width="106" height="34" rx="9" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.2" />
        <circle cx="15" cy="17" r="3.4" fill="#F59E0B" />
        <text x="61" y="21.2" font-size="12" font-weight="700" fill="#F8FAFC">Expo SDK</text>
      </g>

      <!-- Pill 5: Clean Architecture (w=162) -->
      <g transform="translate(182, 0)">
        <rect x="0" y="0" width="162" height="34" rx="9" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.2" />
        <circle cx="15" cy="17" r="3.4" fill="#A855F7" />
        <text x="89" y="21.2" font-size="12" font-weight="700" fill="#F8FAFC">Clean Architecture</text>
      </g>
    </g>
  </g>
</svg>
