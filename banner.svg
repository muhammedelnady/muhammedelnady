      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="78%" stop-color="#10B981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="hero-glow-a-dark" cx="14%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.16" />
