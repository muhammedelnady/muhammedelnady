      <stop offset="100%" stop-color="#0D1426" stop-opacity="0" />
    </radialGradient>
    <pattern id="hero-grid-dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#61DAFB" stroke-width="0.6" stroke-opacity="0.045" />
    </pattern>
    <linearGradient id="hero-title-dark" x1="0%" y1="0%" x2="100%" y2="0%">
