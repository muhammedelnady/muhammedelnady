    </linearGradient>
    <clipPath id="hero-clip-dark">
      <rect x="1" y="1" width="894" height="314" rx="20" />
    </clipPath>
    <style>
      @keyframes statusPulse-dark {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.9); }
      }
      @keyframes scanBar-dark {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .pulse-ring-dark {
        transform-box: fill-box;
        transform-origin: center;
        animation: statusPulse-dark 2.6s ease-in-out infinite;
      }
      .hud-live-dark {
        animation: scanBar-dark 3s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-ring-dark, .hud-live-dark { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#hero-clip-dark)">
