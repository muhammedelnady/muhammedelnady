      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="stats-top-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087EA4" stop-opacity="0" />
      <stop offset="30%" stop-color="#087EA4" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#0A66C2" stop-opacity="0.85" />
