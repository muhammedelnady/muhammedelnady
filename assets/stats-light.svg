    <linearGradient id="ring-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087EA4" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <style>
      @keyframes ringSweep-light {
        from { stroke-dashoffset: 251.33; }
        to { stroke-dashoffset: 41.42; }
      }
      .ring-progress-light {
        stroke-dasharray: 251.33;
        stroke-dashoffset: 41.42;
        animation: ringSweep-light 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        .ring-progress-light { animation: none; stroke-dashoffset: 41.42; }
      }
    </style>
  </defs>

