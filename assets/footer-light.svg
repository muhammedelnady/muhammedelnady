<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Mohamed Elnady — Ship Fast. Feel Native. Scale Clean.">
  <defs>
    <clipPath id="footer-card-clip-light">
      <rect x="8" y="8" width="1184" height="124" rx="18" />
    </clipPath>

    <linearGradient id="footer-bg-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="footer-stroke-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087EA4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="1" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="footer-laser-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087EA4" stop-opacity="0" />
      <stop offset="22%" stop-color="#087EA4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0A66C2" stop-opacity="0.9" />
      <stop offset="78%" stop-color="#087EA4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="footer-capsule-stroke-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087EA4" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="1" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="footer-text-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#087EA4" />
      <stop offset="100%" stop-color="#0A66C2" />
    </linearGradient>

    <pattern id="footer-grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#087EA4" stroke-width="0.5" stroke-opacity="0.06" />
      <circle cx="40" cy="0" r="0.9" fill="#087EA4" fill-opacity="0.16" />
    </pattern>

    <filter id="footer-shadow-light" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07" />
    </filter>

    <style>
      @keyframes capsuleFloatLight {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes eqBarLight {
        0%, 100% { transform: scaleY(0.42); }
        50% { transform: scaleY(1); }
      }

      .capsule-float { animation: capsuleFloatLight 4.2s ease-in-out infinite; }
      .eq-1 { transform-box: fill-box; transform-origin: center; animation: eqBarLight 1.8s ease-in-out infinite; }
      .eq-2 { transform-box: fill-box; transform-origin: center; animation: eqBarLight 1.4s ease-in-out 0.4s infinite; }
      .eq-3 { transform-box: fill-box; transform-origin: center; animation: eqBarLight 2.1s ease-in-out 0.8s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .capsule-float, .eq-1, .eq-2, .eq-3 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#footer-card-clip-light)">
    <rect x="8" y="8" width="1184" height="124" fill="url(#footer-bg-light)" />
    <rect x="8" y="8" width="1184" height="124" fill="url(#footer-grid-light)" />
  </g>

  <rect x="8.75" y="8.75" width="1182.5" height="122.5" rx="18" fill="none" stroke="url(#footer-stroke-light)" stroke-width="1.4" />

  <line x1="110" y1="22" x2="1090" y2="22" stroke="url(#footer-laser-light)" stroke-width="1.5" opacity="0.6" />
  <circle cx="600" cy="22" r="3" fill="#087EA4">
    <animate attributeName="cx" values="220;980;220" dur="7s" repeatCount="indefinite" />
  </circle>

  <g opacity="0.7" stroke="url(#footer-capsule-stroke-light)" stroke-width="1.3" fill="none">
    <path d="M 326 47 L 292 47 L 276 68 L 292 89 L 326 89" />
    <path d="M 874 47 L 908 47 L 924 68 L 908 89 L 874 89" />
  </g>

  <g fill="#087EA4" opacity="0.75">
    <rect class="eq-1" x="302" y="58" width="3" height="20" rx="1.5" />
    <rect class="eq-2" x="309" y="58" width="3" height="20" rx="1.5" fill="#0A66C2" />
    <rect class="eq-3" x="316" y="58" width="3" height="20" rx="1.5" />

    <rect class="eq-3" x="881" y="58" width="3" height="20" rx="1.5" />
    <rect class="eq-2" x="888" y="58" width="3" height="20" rx="1.5" fill="#0A66C2" />
    <rect class="eq-1" x="895" y="58" width="3" height="20" rx="1.5" />
  </g>

  <g transform="translate(600, 68)">
    <g class="capsule-float" filter="url(#footer-shadow-light)">
      <rect x="-244" y="-22" width="488" height="44" rx="22" fill="#FFFFFF" stroke="url(#footer-capsule-stroke-light)" stroke-width="1.4" />
      <path d="M -212 -7.5 L -218.5 1 H -213.5 L -215 7.5 L -208 -0.5 H -213 L -212 -7.5 Z" fill="#087EA4" />
      <text x="0" y="5" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="url(#footer-text-light)" letter-spacing="2.4" text-anchor="middle">
        SHIP FAST <tspan fill="#087EA4">·</tspan> FEEL NATIVE <tspan fill="#087EA4">·</tspan> SCALE CLEAN
      </text>
      <path d="M 213 -7.5 L 206.5 1 H 211.5 L 210 7.5 L 217 -0.5 H 212 L 213 -7.5 Z" fill="#087EA4" />
    </g>
  </g>

  <text x="600" y="114" font-family="'SF Mono', 'Fira Code', -apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="1.5" text-anchor="middle">
    ARCHITECTING PRODUCTION MOBILE ECOSYSTEMS <tspan fill="#087EA4">•</tspan> E-COMMERCE <tspan fill="#087EA4">•</tspan> PROPTECH <tspan fill="#087EA4">•</tspan> ON-DEMAND
  </text>
</svg>
