  </g>

  <!-- Left Editorial Identity -->
  <text x="30" y="106" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2" fill="url(#hero-title-light)">Mohamed Elnady</text>
  <text x="30" y="135" font-family="'Plus Jakarta Sans', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#087EA4">Senior React Native &amp; Mobile Product Architect</text>
  <text x="30" y="164" font-family="'Plus Jakarta Sans', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">8+ years turning complex product domains into resilient cross-platform &amp; native apps.</text>
  <text x="30" y="186" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="11.2" font-weight="600" fill="#0F172A">Expo SDK 58 <tspan fill="#087EA4">·</tspan> New Arch (JSI/Fabric) <tspan fill="#087EA4">·</tspan> Swift 6 <tspan fill="#087EA4">·</tspan> Kotlin 2.2 <tspan fill="#087EA4">·</tspan> True RTL</text>

