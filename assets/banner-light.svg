      <text x="236" y="16.2" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="9.8" font-weight="600" fill="#334155">Reanimated 4 · Skia</text>
