      <text x="23" y="16.2" font-family="'Plus Jakarta Sans', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.8" font-weight="600" fill="#0F172A">Domain &amp; Sync</text>
      <text x="236" y="16.2" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="9.8" font-weight="600" fill="#334155">Clean Arch · MMKV</text>
    </g>
    <g transform="translate(606, 166)">
