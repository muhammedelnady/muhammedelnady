<svg xmlns="http://www.w3.org/2000/svg" width="896" height="316" viewBox="0 0 896 316" role="img" aria-label="Mohamed Elnady — Senior React Native &amp; Mobile Product Architect">
  <defs>
    
    <linearGradient id="hero-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="hero-topline-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087EA4" stop-opacity="0" />
      <stop offset="28%" stop-color="#087EA4" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.9" />
      <stop offset="78%" stop-color="#059669" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="hero-glow-a-light" cx="14%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#087EA4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hero-glow-b-light" cx="88%" cy="22%" r="46%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0" />
    </radialGradient>
    <pattern id="hero-grid-light" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#087EA4" stroke-width="0.6" stroke-opacity="0.04" />
    </pattern>
    <linearGradient id="hero-title-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" /><stop offset="60%" stop-color="#1E293B" /><stop offset="100%" stop-color="#087EA4" />
    </linearGradient>
    <clipPath id="hero-clip-light">
      <rect x="1" y="1" width="894" height="314" rx="20" />
    </clipPath>
    <style>
      @keyframes statusPulse-light {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.9); }
      }
      @keyframes scanBar-light {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .pulse-ring-light {
        transform-box: fill-box;
        transform-origin: center;
        animation: statusPulse-light 2.6s ease-in-out infinite;
      }
      .hud-live-light {
        animation: scanBar-light 3s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-ring-light, .hud-live-light { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#hero-clip-light)">
    <rect x="1" y="1" width="894" height="314" fill="url(#hero-bg-light)" />
    <rect x="1" y="1" width="894" height="314" fill="url(#hero-glow-a-light)" />
    <rect x="1" y="1" width="894" height="314" fill="url(#hero-glow-b-light)" />
    <rect x="1" y="1" width="894" height="314" fill="url(#hero-grid-light)" />
  </g>

  <rect x="1" y="1" width="894" height="314" rx="20" fill="none" stroke="#CBD5E1" stroke-width="1.3" />
  <line x1="48" y1="1.5" x2="848" y2="1.5" stroke="url(#hero-topline-light)" stroke-width="1.8" opacity="0.72" />

